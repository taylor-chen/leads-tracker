name: leads-tracker

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: leads
      POSTGRES_DB: leads
    ports:
      - "5433:5432"  # host port 5433 to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads -d leads"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    # Local SMTP server that catches all outgoing email. Inbox UI: http://localhost:8025
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://leads:leads@postgres:5432/leads
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-in-production-please}
      CORS_ORIGINS: http://localhost:3000
      # SMTP defaults to the local Mailpit catcher. Override in .env to send real email.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      EMAIL_FROM: ${EMAIL_FROM:-Leads Tracker <no-reply@leads.local>}
      ATTORNEY_NOTIFICATION_EMAIL: ${ATTORNEY_NOTIFICATION_EMAIL:-attorney@example.com}
      FRONTEND_BASE_URL: http://localhost:3000
      SEED_ATTORNEY_EMAIL: ${SEED_ATTORNEY_EMAIL:-attorney@example.com}
      SEED_ATTORNEY_PASSWORD: ${SEED_ATTORNEY_PASSWORD:-changeme123}
      SEED_ATTORNEY_NAME: ${SEED_ATTORNEY_NAME:-Alex Attorney}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
